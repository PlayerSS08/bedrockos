# BedrockOS boot options, one per line (# starts a comment).
# quiet | debug | verbose | nomenu | timeout=N | timeout=wait | mode=WxH | recovery | nocount | nolapic | tz=+HH:MM
# The boot menu waits until you choose an entry and press Enter (timeout=N starts it after N seconds).
timeout=wait
# Time zone of the clock (the hardware clock runs on UTC). India: +05:30. Change later with the tz command.
tz=+05:30
